<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="fashionBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18002E"/>
      <stop offset="45%" stop-color="#2D0B5A"/>
      <stop offset="100%" stop-color="#0A0118"/>
    </linearGradient>
    <linearGradient id="iridescent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF52E5"/>
      <stop offset="35%" stop-color="#9A6ADF"/>
      <stop offset="70%" stop-color="#4DEEEA"/>
      <stop offset="100%" stop-color="#FFE066"/>
    </linearGradient>
    <linearGradient id="chromeGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#E2D4F7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#9A6ADF" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="neonBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="35" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Runway Backdrop -->
  <rect width="1200" height="800" fill="url(#fashionBg)"/>

  <!-- High-Fashion Runway Lighting Rays -->
  <polygon points="600,0 200,800 350,800" fill="#9A6ADF" opacity="0.08"/>
  <polygon points="600,0 850,800 1000,800" fill="#FF52E5" opacity="0.08"/>

  <!-- Geometric Abstract Avant-Garde Garment Structure -->
  <g transform="translate(600, 420)" filter="url(#neonBlur)">
    <!-- Origami Pleat Folds -->
    <polygon points="0,-220 -140,-60 -50,180 50,180 140,-60" fill="url(#iridescent)" opacity="0.85"/>
    <polygon points="0,-220 -80,-80 0,160 80,-80" fill="url(#chromeGlow)"/>
    <polygon points="-140,-60 -220,60 -90,140" fill="#9A6ADF" opacity="0.7"/>
    <polygon points="140,-60 220,60 90,140" fill="#FF52E5" opacity="0.7"/>

    <!-- Kinetic Floating Ribbons -->
    <path d="M-180 -120 Q0 -300 180 -120 Q0 60 -180 -120" stroke="url(#iridescent)" stroke-width="4" fill="none"/>
    <circle cx="0" cy="-240" r="12" fill="#FFFFFF" opacity="0.9"/>
  </g>

  <!-- Editorial Text Overlay -->
  <text x="600" y="680" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="8">NEO • COUTURE</text>
  <text x="600" y="715" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#D8B8FF" text-anchor="middle" letter-spacing="4">AUTUMN / WINTER SYNTHETIC EDITORIAL</text>

  <!-- Brand Badge Top Left -->
  <g transform="translate(60, 60)">
    <rect width="210" height="34" rx="17" fill="#200A3E" stroke="#FF52E5" stroke-width="1"/>
    <circle cx="20" cy="17" r="6" fill="#FF52E5"/>
    <text x="36" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" letter-spacing="1">AURA ATELIER PARIS</text>
  </g>

  <!-- Category Tag Top Right -->
  <g transform="translate(970, 60)">
    <rect width="170" height="34" rx="17" fill="#FF52E5" fill-opacity="0.2" stroke="#FF52E5" stroke-width="1"/>
    <text x="85" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#FF52E5" text-anchor="middle" letter-spacing="1">HAUTE COUTURE AI</text>
  </g>
</svg>
