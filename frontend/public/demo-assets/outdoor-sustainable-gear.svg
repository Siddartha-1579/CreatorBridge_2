<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="outdoorBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2027"/>
      <stop offset="50%" stop-color="#203A43"/>
      <stop offset="100%" stop-color="#2C5364"/>
    </linearGradient>
    <linearGradient id="mountain1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4B79A1"/>
      <stop offset="100%" stop-color="#283E51"/>
    </linearGradient>
    <linearGradient id="jacketGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="100%" stop-color="#FFE66D"/>
    </linearGradient>
    <filter id="gearShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Sky & Atmospheric Base -->
  <rect width="1200" height="800" fill="url(#outdoorBg)"/>

  <!-- Distant Alpine Mountain Peaks -->
  <polygon points="100,600 350,280 600,600" fill="url(#mountain1)" opacity="0.35"/>
  <polygon points="450,650 750,220 1050,650" fill="url(#mountain1)" opacity="0.45"/>
  <polygon points="-50,700 200,380 480,700" fill="#1C3144" opacity="0.7"/>
  <polygon points="700,700 980,340 1250,700" fill="#1C3144" opacity="0.75"/>

  <!-- Snow Caps on Peaks -->
  <polygon points="750,220 710,270 790,270" fill="#E0F2FE" opacity="0.7"/>
  <polygon points="350,280 320,320 380,320" fill="#E0F2FE" opacity="0.6"/>

  <!-- Topographic Contour Lines -->
  <path d="M0 450 Q300 400 600 460 T1200 420" stroke="#38BDF8" stroke-width="0.75" fill="none" opacity="0.25"/>
  <path d="M0 500 Q300 470 600 520 T1200 480" stroke="#38BDF8" stroke-width="0.75" fill="none" opacity="0.2"/>
  <path d="M0 550 Q300 530 600 570 T1200 540" stroke="#38BDF8" stroke-width="0.75" fill="none" opacity="0.15"/>

  <!-- Hero Technical Shell Silhouette / Concept Card -->
  <g transform="translate(420, 240)" filter="url(#gearShadow)">
    <rect width="360" height="420" rx="24" fill="#0B131F" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.4"/>
    
    <!-- Technical Shell Graphic Schematic -->
    <path d="M180 80 L120 140 L140 340 L220 340 L240 140 Z" fill="#1E293B" stroke="#0EA5E9" stroke-width="2"/>
    <path d="M180 80 L140 120 L180 340 L220 120 Z" fill="#0284C7" fill-opacity="0.3"/>
    <!-- Sealed Seams Accent -->
    <line x1="180" y1="80" x2="180" y2="340" stroke="#F59E0B" stroke-width="2.5" stroke-dasharray="4 2"/>
    <circle cx="180" cy="80" r="14" fill="#F59E0B" fill-opacity="0.2" stroke="#F59E0B" stroke-width="1.5"/>

    <!-- Spec Badges -->
    <text x="180" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#F8FAFC" text-anchor="middle" letter-spacing="2">APEX STORM-SHELL 3L</text>
    <text x="180" y="400" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#38BDF8" text-anchor="middle" letter-spacing="1.5">20,000MM WATERPROOF • RECYCLED RIPSTOP</text>
  </g>

  <!-- Brand Badge Top Left -->
  <g transform="translate(60, 60)">
    <rect width="200" height="34" rx="17" fill="#0B131F" fill-opacity="0.8" stroke="#38BDF8" stroke-width="1"/>
    <polygon points="20,12 28,24 12,24" fill="#38BDF8"/>
    <text x="36" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#F8FAFC" letter-spacing="1">TERRA OUTDOOR GEAR</text>
  </g>

  <!-- Category Tag Top Right -->
  <g transform="translate(970, 60)">
    <rect width="170" height="34" rx="17" fill="#38BDF8" fill-opacity="0.15" stroke="#38BDF8" stroke-width="1"/>
    <text x="85" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#38BDF8" text-anchor="middle" letter-spacing="1">OUTDOOR & TECHNICAL</text>
  </g>
</svg>
