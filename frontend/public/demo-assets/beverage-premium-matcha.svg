<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="zenBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141E16"/>
      <stop offset="50%" stop-color="#243328"/>
      <stop offset="100%" stop-color="#101912"/>
    </linearGradient>
    <linearGradient id="matchaEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#84CC16"/>
      <stop offset="50%" stop-color="#4D7C0F"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>
    <linearGradient id="ceremonyBowl" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#27272A"/>
      <stop offset="30%" stop-color="#3F3F46"/>
      <stop offset="70%" stop-color="#27272A"/>
      <stop offset="100%" stop-color="#18181B"/>
    </linearGradient>
    <radialGradient id="matchaFroth" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A3E635"/>
      <stop offset="70%" stop-color="#65A30D"/>
      <stop offset="100%" stop-color="#365314"/>
    </radialGradient>
    <filter id="zenShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Zen Minimalist Tatami / Slate Dark Background -->
  <rect width="1200" height="800" fill="url(#zenBg)"/>

  <!-- Minimalist Japanese Enso Circle Accent -->
  <circle cx="600" cy="400" r="280" stroke="#365314" stroke-width="3" fill="none" opacity="0.35" stroke-dasharray="800 200"/>

  <!-- Ceremonial Bowl & Whisk Composition -->
  <g transform="translate(600, 420)" filter="url(#zenShadow)">
    <!-- Slate Plinth -->
    <ellipse cx="0" cy="180" rx="340" ry="50" fill="#18181B" opacity="0.8"/>

    <!-- Ceramic Chawan (Bowl) Body -->
    <path d="M-190 -10 C-190 140 -120 180 0 180 C120 180 190 140 190 -10 Z" fill="url(#ceremonyBowl)"/>
    
    <!-- Bowl Rim Oval -->
    <ellipse cx="0" cy="-10" rx="190" ry="55" fill="#1C1917" stroke="#52525B" stroke-width="2"/>
    
    <!-- Vibrant Emerald Matcha Liquid Pool -->
    <ellipse cx="0" cy="-8" rx="175" ry="48" fill="url(#matchaFroth)"/>

    <!-- Micro Foam Froth Patterns -->
    <ellipse cx="-40" cy="-10" rx="35" ry="12" fill="#BEF264" opacity="0.4"/>
    <ellipse cx="45" cy="-6" rx="25" ry="8" fill="#BEF264" opacity="0.35"/>
    <circle cx="0" cy="-8" r="6" fill="#ECFCCB" opacity="0.6"/>
  </g>

  <!-- Title & Typography -->
  <text x="600" y="680" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="#F4FBF4" text-anchor="middle" letter-spacing="6">KISSA MATCHA</text>
  <text x="600" y="715" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#84CC16" text-anchor="middle" letter-spacing="4">CEREMONIAL UJI SINGLE-ESTATE HARVEST</text>

  <!-- Brand Badge Top Left -->
  <g transform="translate(60, 60)">
    <rect width="210" height="34" rx="17" fill="#18251B" stroke="#84CC16" stroke-width="1"/>
    <circle cx="20" cy="17" r="6" fill="#84CC16"/>
    <text x="36" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#F4FBF4" letter-spacing="1">KISSA TEA CO.</text>
  </g>

  <!-- Category Tag Top Right -->
  <g transform="translate(970, 60)">
    <rect width="170" height="34" rx="17" fill="#84CC16" fill-opacity="0.15" stroke="#84CC16" stroke-width="1"/>
    <text x="85" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#84CC16" text-anchor="middle" letter-spacing="1">PREMIUM BEVERAGE</text>
  </g>
</svg>
