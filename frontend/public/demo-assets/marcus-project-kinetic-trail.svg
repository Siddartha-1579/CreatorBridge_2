<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgKinetic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="trailGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bgKinetic)"/>
  <!-- Kinetic Speed Trails & Particle Lines -->
  <path d="M50 200 Q400 120 750 350" stroke="url(#trailGrad)" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M80 250 Q400 180 720 400" stroke="#38BDF8" stroke-width="3" fill="none" opacity="0.8"/>
  <path d="M120 300 Q400 240 680 440" stroke="#818CF8" stroke-width="2" fill="none" opacity="0.6"/>
  <!-- Motion Blur Particle Rings -->
  <circle cx="480" cy="270" r="80" stroke="#06B6D4" stroke-width="2" fill="none" opacity="0.4"/>
  <circle cx="480" cy="270" r="40" fill="#38BDF8" opacity="0.8"/>
  <polygon points="475,255 495,270 475,285" fill="#020617"/>
  <!-- Metadata Banner -->
  <rect x="40" y="500" width="720" height="60" rx="16" fill="#0B132B" fill-opacity="0.9" stroke="#1D4ED8" stroke-width="1"/>
  <text x="60" y="535" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF">KINETIC TRAILS • 4K 60FPS</text>
  <text x="60" y="552" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#38BDF8">Runway Gen-3 Alpha • Topaz Video AI • Full Commercial Broadcast</text>
  <text x="730" y="538" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#60A5FA" text-anchor="end">AI MOTION</text>
</svg>
