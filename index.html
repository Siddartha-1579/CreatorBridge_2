<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="CreatorBridge — Where Brands Meet Creativity. Intelligent AI Creator Marketplace connecting brands with specialized generative talent." />
  <meta name="theme-color" content="#F4F7F7" />
  <title>CreatorBridge — Where Brands Meet Creativity</title>
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('creatorbridge_theme') || 'deep-teal';
        var isLight = stored === 'mist-light' || stored === 'light';
        document.documentElement.setAttribute('data-theme', stored);
        if (isLight) {
          document.documentElement.classList.remove('dark');
          document.documentElement.style.colorScheme = 'light';
        } else {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
        }
      } catch (e) { }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
