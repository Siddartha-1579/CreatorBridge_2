<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CreatorBridge — Where Brands Meet Creativity. Intelligent AI Creator Marketplace connecting brands with specialized generative talent." />
    <meta name="theme-color" content="#FFFDFD" />
    <title>CreatorBridge — Where Brands Meet Creativity</title>
    <script>
      (function() {
        try {
          // Color mode (dark/light)
          var stored = localStorage.getItem('creatorbridge_theme');
          var isDark = stored === 'dark' || ((!stored || stored === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }

          // 6-Theme Palette Customization
          var validThemes = ['ruby-marble', 'crimson-pearl', 'scarlet-ivory', 'wine-silver', 'cherry-cream', 'scarlet-ruby-rose'];
          var storedTheme = localStorage.getItem('creatorbridge_global_theme_id');
          var themeId = validThemes.indexOf(storedTheme) !== -1 ? storedTheme : 'ruby-marble';
          document.documentElement.setAttribute('data-theme', themeId);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
