<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="skinBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF8F5"/>
      <stop offset="40%" stop-color="#F7EBE4"/>
      <stop offset="100%" stop-color="#E9D2C6"/>
    </linearGradient>
    <linearGradient id="glowWarm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD7A8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#9A6ADF" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="glassBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="25%" stop-color="#F8E5DB" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#E6C8B8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="goldCap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA7C11"/>
    </linearGradient>
    <radialGradient id="droplet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFEEDD"/>
      <stop offset="70%" stop-color="#E5AA70"/>
      <stop offset="100%" stop-color="#885522" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#552211" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="800" fill="url(#skinBg)"/>
  
  <!-- Ambient Atmospheric Blooms -->
  <circle cx="600" cy="380" r="320" fill="url(#glowWarm)" filter="blur(60px)"/>
  <circle cx="950" cy="200" r="200" fill="#FFD7A8" fill-opacity="0.3" filter="blur(50px)"/>
  <circle cx="200" cy="650" r="250" fill="#F4E7FF" fill-opacity="0.4" filter="blur(70px)"/>

  <!-- Pedestal Platform -->
  <ellipse cx="600" cy="620" rx="360" ry="60" fill="#E2CEC3" opacity="0.6"/>
  <ellipse cx="600" cy="610" rx="320" ry="45" fill="#FAF2EC" opacity="0.9" filter="url(#softShadow)"/>

  <!-- Serum Bottle Body -->
  <g filter="url(#softShadow)">
    <!-- Dropper Cap -->
    <rect x="560" y="210" width="80" height="24" rx="6" fill="#FFFFFF" opacity="0.9"/>
    <rect x="565" y="170" width="70" height="42" rx="4" fill="url(#goldCap)"/>
    <path d="M575 170 C575 140 625 140 625 170 Z" fill="#F0E8E2"/>

    <!-- Bottle Glass Cylinder -->
    <rect x="510" y="240" width="180" height="340" rx="28" fill="url(#glassBody)"/>
    <rect x="515" y="245" width="170" height="330" rx="24" fill="#FFFFFF" fill-opacity="0.15"/>

    <!-- Serum Liquid Level -->
    <path d="M520 330 Q600 340 680 330 L680 560 Q600 575 520 560 Z" fill="#E8B99B" opacity="0.55"/>

    <!-- Bottle Label -->
    <rect x="535" y="340" width="130" height="180" rx="8" fill="#FFFFFF" opacity="0.95"/>
    <text x="600" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#AA7C11" text-anchor="middle" letter-spacing="3">LUMINA</text>
    <text x="600" y="415" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" fill="#221108" text-anchor="middle" letter-spacing="1">CELLULAR</text>
    <text x="600" y="435" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#442211" text-anchor="middle" letter-spacing="2">RADIANCE</text>
    <line x1="560" y1="455" x2="640" y2="455" stroke="#AA7C11" stroke-width="0.75"/>
    <text x="600" y="480" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="600" fill="#886655" text-anchor="middle" letter-spacing="1.5">HYALURONIC + PEPTIDES</text>
    <text x="600" y="500" font-family="system-ui, -apple-system, sans-serif" font-size="7" font-weight="400" fill="#AA8877" text-anchor="middle">30 ML / 1.0 FL OZ</text>
  </g>

  <!-- Floating Liquid Droplet Accent -->
  <circle cx="780" cy="380" r="16" fill="url(#droplet)"/>
  <circle cx="784" cy="376" r="4" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="420" cy="460" r="10" fill="url(#droplet)" opacity="0.8"/>

  <!-- Luxury Badge Top Left -->
  <g transform="translate(60, 60)">
    <rect width="180" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.8" stroke="#D8B8FF" stroke-width="1"/>
    <circle cx="20" cy="17" r="6" fill="#9A6ADF"/>
    <text x="36" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#111111" letter-spacing="1">LUMINA SKINCARE</text>
  </g>

  <!-- Category Tag Top Right -->
  <g transform="translate(980, 60)">
    <rect width="160" height="34" rx="17" fill="#9A6ADF" fill-opacity="0.15" stroke="#9A6ADF" stroke-width="1"/>
    <text x="80" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#9A6ADF" text-anchor="middle" letter-spacing="1">COMMERCIAL BRIEF</text>
  </g>
</svg>
